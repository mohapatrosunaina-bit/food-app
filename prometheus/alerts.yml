groups:
  - name: Tuckin
    rules:
      - alert: TuckinHighOrderErrorRate
        expr: rate(Tuckin_http_errors_total[5m]) / clamp_min(rate(Tuckin_http_requests_total[5m]), 0.001) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Tuckin error rate is above 5%
          description: More than 5% of requests have returned an error for 2 minutes.
      - alert: TuckinNoReadyRequests
        expr: up{job="Tuckin"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Tuckin metrics target is unreachable
