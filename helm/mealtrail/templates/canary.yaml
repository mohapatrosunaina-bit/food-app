{{- if .Values.canary.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}-canary
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: mealtrail
          image: "{{ .Values.canary.image.repository }}:{{ .Values.canary.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ESTIMATED_DELIVERY_MINUTES
              value: "25"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-canary
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}-canary
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: {{ .Values.canary.weight | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-canary
                port:
                  number: {{ .Values.service.port }}
{{- end }}
