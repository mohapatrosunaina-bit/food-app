---
- name: Schedule weekly Tuckin delivery log retention
  hosts: Tuckin_hosts
  become: true
  tasks:
    - name: Run cleanup each Sunday at 03:15
      ansible.builtin.cron:
        name: Tuckin delivery log retention
        user: root
        weekday: "0"
        hour: "3"
        minute: "15"
        job: "cd /opt/Tuckin && ansible-playbook -i inventory cleanup-delivery-logs.yml >> /var/log/Tuckin/cleanup.log 2>&1"
